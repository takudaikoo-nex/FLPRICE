# ================================================
# 供花発注サイト Nginx 設定
#   配置先: /etc/nginx/sites-available/flower
#   有効化: ln -s /etc/nginx/sites-available/flower /etc/nginx/sites-enabled/
#
# ★ SERVER_NAME を実際のドメインに置き換えてください
# ================================================

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # certbot がこの設定に443のブロックを追記します
    root /var/www/flower;
    index index.html;

    # ---- SPAフォールバック（/order/<token> を直接開けるようにする） ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- ハッシュ付きアセットは長期キャッシュ ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- index.html はキャッシュさせない（デプロイ後すぐ反映させるため） ----
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- セキュリティヘッダ ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 圧縮 ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 隠しファイルへのアクセスを拒否 ----
    location ~ /\. {
        deny all;
    }
}
